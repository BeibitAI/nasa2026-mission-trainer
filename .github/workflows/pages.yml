# Deploys web/ (landing + Unity WebGL build in web/play/) to GitHub Pages on every push to main.
# OWNER: Muhammad
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "unity/MissionTrainer/Assets/_Project/Resources/Data/sources.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy shared data into the site
        run: |
          mkdir -p web/data
          cp unity/MissionTrainer/Assets/_Project/Resources/Data/sources.json web/data/sources.json
          touch web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
