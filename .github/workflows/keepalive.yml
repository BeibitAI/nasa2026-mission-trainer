# Keeps the Render free backend awake (it sleeps after ~15 min idle -> 30-50 s cold start).
# The game works without it (fallback texts), but judges should get the live AI Commander.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 60 https://mission-trainer-api.onrender.com/health; then exit 0; fi
            sleep 10
          done
          echo "Backend did not answer (the game still works offline)."
