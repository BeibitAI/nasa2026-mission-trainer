# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: mission-trainer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: ALLOWED_ORIGINS
        value: https://beibitai.github.io,http://localhost:8000
      - key: GEMINI_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
