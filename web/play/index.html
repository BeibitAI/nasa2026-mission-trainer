<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sol by Sol: Mars Base Trainer</title>
  <meta name="description" content="Run a base on Mars, one sol at a time. Real NASA data decides when the storms come.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app" class="app" data-phase="loading">
    <header class="top">
      <div class="brand">
        <span class="planet" aria-hidden="true"></span>
        <div>
          <div class="brand-title" id="brandTitle">Gale Crater Base</div>
          <div class="brand-sub" id="solLabel">Loading mission data…</div>
        </div>
      </div>
      <ol class="sols" id="solDots" aria-label="Mission progress"></ol>
      <div class="top-actions">
        <button class="ghost" id="btnLang" type="button">RU</button>
        <button class="ghost" id="btnSources" type="button">Data sources</button>
        <button class="ghost icon" id="btnFull" type="button" title="Full screen" aria-label="Full screen">⛶</button>
      </div>
    </header>

    <main class="layout">
      <section class="left">
        <div class="scene-wrap" id="sceneWrap">
          <svg id="scene" class="scene" viewBox="0 0 640 300" role="img" aria-label="Your Mars base"></svg>
          <div class="scene-tags" id="sceneTags"></div>
        </div>
        <div class="commander" id="commander" aria-live="polite">
          <div class="avatar" aria-hidden="true">N</div>
          <div class="bubble">
            <div class="who"><span id="cmdName">Commander Nova</span> <span class="badge" id="cmdBadge"></span></div>
            <p class="say" id="cmdText">Getting ready…</p>
            <p class="tip" id="cmdTip"></p>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="bars" id="bars"></div>
        <div class="panel" id="panel"></div>
      </section>
    </main>

    <div class="overlay" id="overlay" hidden></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
